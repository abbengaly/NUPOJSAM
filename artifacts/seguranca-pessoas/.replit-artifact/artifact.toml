kind = "web"
previewPath = "/"
title = "Gestão de Segurança"
description = "Sistema web para gerenciar agentes de polícia judicial, escalas mensais, férias e banco de horas da equipe de segurança."
version = "1.0.0"
id = "artifacts/seguranca-pessoas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25765

[services.development]
run = "pnpm --filter @workspace/seguranca-pessoas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seguranca-pessoas", "run", "build" ]
serve = "static"
publicDir = "artifacts/seguranca-pessoas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25765"
BASE_PATH = "/"
